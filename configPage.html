<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>YouTubeHome</title>
</head>
<body>
<div id="YouTubeHomeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <h1>YouTubeHome</h1>
            <form id="YouTubeHomeForm">

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="chkEnabled" type="checkbox" is="emby-checkbox" />
                        <span>Enable YouTube-style feed</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="chkReplaceHome" type="checkbox" is="emby-checkbox" />
                        <span>Replace the default home screen</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">
                        Requires the client script to be loaded (see README).
                    </div>
                </div>

                <h3>Libraries to use</h3>
                <div class="fieldDescription">Pick one or more libraries containing your downloaded YouTube videos.</div>
                <!-- Filled dynamically from /Library/VirtualFolders -->
                <div id="libraryList"></div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="numItemsPerRow">Videos per row</label>
                    <input id="numItemsPerRow" type="number" is="emby-input" min="4" max="60" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="numChannelRows">Channel rows</label>
                    <input id="numChannelRows" type="number" is="emby-input" min="0" max="12" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="numPoolSize">Candidate pool size per library</label>
                    <input id="numPoolSize" type="number" is="emby-input" min="50" max="5000" />
                    <div class="fieldDescription">Random videos fetched per library before shuffling. Lower = faster on huge libraries.</div>
                </div>

                <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                    <span>Save</span>
                </button>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var pluginId = '6d8c1e52-3f0a-4b57-9c1d-2a7e5b9f4c10'; // must match Plugin.PluginGuid
            var page = document.querySelector('#YouTubeHomeConfigPage');

            // Build one checkbox per library. Checkboxes (instead of a <select multiple>) render
            // consistently with Jellyfin's theme and make multi-selection obvious.
            function renderLibraries(folders, selected) {
                var host = page.querySelector('#libraryList');
                host.innerHTML = '';
                folders.forEach(function (f) {
                    var label = document.createElement('label');
                    label.className = 'emby-checkbox-label';
                    var input = document.createElement('input');
                    input.type = 'checkbox';
                    input.setAttribute('is', 'emby-checkbox');
                    input.className = 'chkLibrary';
                    input.dataset.id = f.ItemId;
                    input.checked = selected.indexOf(f.ItemId) !== -1;
                    var span = document.createElement('span');
                    span.textContent = f.Name + (f.CollectionType ? ' (' + f.CollectionType + ')' : '');
                    label.appendChild(input);
                    label.appendChild(span);
                    var wrap = document.createElement('div');
                    wrap.className = 'checkboxContainer';
                    wrap.appendChild(label);
                    host.appendChild(wrap);
                });
            }

            page.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                Promise.all([
                    ApiClient.getPluginConfiguration(pluginId),
                    ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders'))
                ]).then(function (res) {
                    var cfg = res[0], folders = res[1];
                    page.querySelector('#chkEnabled').checked = cfg.Enabled;
                    page.querySelector('#chkReplaceHome').checked = cfg.ReplaceHomePage;
                    page.querySelector('#numItemsPerRow').value = cfg.ItemsPerRow;
                    page.querySelector('#numChannelRows').value = cfg.ChannelRows;
                    page.querySelector('#numPoolSize').value = cfg.CandidatePoolSize;
                    renderLibraries(folders, cfg.SelectedLibraryIds || []);
                    Dashboard.hideLoadingMsg();
                });
            });

            page.querySelector('#YouTubeHomeForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
                    cfg.Enabled = page.querySelector('#chkEnabled').checked;
                    cfg.ReplaceHomePage = page.querySelector('#chkReplaceHome').checked;
                    cfg.ItemsPerRow = parseInt(page.querySelector('#numItemsPerRow').value, 10) || 24;
                    cfg.ChannelRows = parseInt(page.querySelector('#numChannelRows').value, 10) || 0;
                    cfg.CandidatePoolSize = parseInt(page.querySelector('#numPoolSize').value, 10) || 400;
                    cfg.SelectedLibraryIds = Array.prototype.map.call(
                        page.querySelectorAll('.chkLibrary:checked'), function (c) { return c.dataset.id; });
                    ApiClient.updatePluginConfiguration(pluginId, cfg)
                        .then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
